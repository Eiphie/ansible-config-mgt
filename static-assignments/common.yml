---
- name: update webservers
  hosts: webservers
  become: true
  remote_user: ubuntu
  tasks:
    - name: Update apt repo
      apt:
        update_cache: yes

    - name: ensure wireshark is at the latest version
      apt:
        name: wireshark
        state: latest

- name: update LB server
  hosts: lb
  become: true
  remote_user: ubuntu
  tasks:
    - name: Update apt repo
      apt:
        update_cache: yes

    - name: ensure wireshark is at the latest version
      apt:
        name: wireshark
        state: latest
